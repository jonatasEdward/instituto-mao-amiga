services:
  - type: web
    name: mao-amiga-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo,kafka-aiven
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: EVENTS_KAFKA_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: https://jonatasedward.github.io
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: KAFKA_ACCESS_CERT
        sync: false
      - key: KAFKA_ACCESS_KEY
        sync: false

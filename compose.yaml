services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maoamiga
      POSTGRES_USER: maoamiga
      POSTGRES_PASSWORD: maoamiga
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maoamiga -d maoamiga"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    profiles: ["api"]
    environment:
      DB_HOST: postgres
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

spring:
  application:
    name: mao-amiga-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maoamiga}
    username: ${DB_USER:maoamiga}
    password: ${DB_PASSWORD:maoamiga}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

server:
  port: ${PORT:8080}

app:
  jwt:
    chave-privada: ${JWT_PRIVATE_KEY:}
    id-da-chave: ${JWT_KEY_ID:mao-amiga-1}
    gerar-chave-temporaria: true
    expiracao: 8h
  eventos:
    publicar-no-kafka: ${EVENTS_KAFKA_ENABLED:false}
    topico-doacoes: maoamiga.donations.v1
    intervalo: PT1S
    tamanho-do-lote: 50
    reter-publicados-por: 7d
  cors:
    origens-permitidas: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

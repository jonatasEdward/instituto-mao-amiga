spring:
  application:
    name: mao-amiga-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maoamiga}
    username: ${DB_USER:maoamiga}
    password: ${DB_PASSWORD:maoamiga}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:segredo-local-de-desenvolvimento-troque-em-producao}
    expiracao: 8h
  cors:
    origens-permitidas: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
